name: Update Provider Schemas

on:
  # Run every Tuesday at 03:00 UTC automatically
  schedule:
    - cron: "0 3 * * 2"

  # Run on every push to any branch
  push:
    branches:
      - "**"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# Grant the workflow permission to commit and push schema updates back to the repo
permissions:
  contents: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    # Skip if this is the workflow's own schema-update commit (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 3. Terraform setup ─────────────────────────────────────────────────
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      # ── 4. Backup existing schemas (safety net) ────────────────────────────
      - name: Backup existing schemas
        run: |
          if [ -d generated-schemas ]; then
            cp -r generated-schemas generated-schemas-backup
            echo "Backup created: generated-schemas-backup/"
          else
            echo "No existing schemas to back up."
          fi

      # ── 5. Generate fresh schemas for ALL providers listed in providers.yml ─
      #       To add a new provider: just add it to providers.yml and push.
      #       No changes needed here.
      - name: Generate latest schemas from all providers
        run: |
          python scripts/generate_schemas.py \
            --output-dir generated-schemas-staging
        env:
          PYTHONUNBUFFERED: "1"

      # ── 6. Validate staging schemas before touching the live folder ─────────
      - name: Validate staging schemas
        run: |
          python scripts/validate_schemas.py \
            --schemas-dir generated-schemas-staging

      # ── 7. Atomic replace: wipe old CSP folders, move staging in ───────────
      - name: Replace schemas atomically
        run: |
          rm -rf generated-schemas
          mv generated-schemas-staging generated-schemas
          echo "Live schemas replaced with validated staging data."

      # ── 8. Detect if anything actually changed ─────────────────────────────
      - name: Check for changes
        id: diff
        run: |
          git add generated-schemas/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No schema changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Schema changes detected — will commit."
          fi

      # ── 9. Commit and push updated schemas back to the same branch ─────────
      - name: Commit and push updated schemas
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update provider schemas [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      # ── 10. Cleanup temp dirs (always runs) ────────────────────────────────
      - name: Cleanup temporary directories
        if: always()
        run: |
          rm -rf generated-schemas-staging
          rm -rf generated-schemas-backup
          find . -maxdepth 3 -name ".terraform"  -type d -exec rm -rf {} + 2>/dev/null || true
          find . -maxdepth 3 -name "*.tfstate"   -type f -delete              2>/dev/null || true
          find . -maxdepth 3 -name "*.tfstate.*" -type f -delete              2>/dev/null || true
          echo "Cleanup done."

      # ── 11. Restore backup on failure (app is never left broken) ────────────
      - name: Restore backup on failure
        if: failure()
        run: |
          if [ -d generated-schemas-backup ]; then
            rm -rf generated-schemas
            mv generated-schemas-backup generated-schemas
            echo "Backup restored after failure."
          fi
